
<div class="row d-flex justify-content-center my-4">
    <div class="col-11 col-md-8 d-flex flex-column align-items-center text-center">
        <h4 class="fs-1 my-4"> {{mainBlog.title }}</h4>
        <img class="img-fluid" [src]="mainBlog.img" alt="imagen de meta andromeda la inteligencia artificial que funciona de fondo en las campaas de meta ads">
        <p class="mt-3">{{ mainBlog.text }}</p>
        <div *ngFor="let texts of mainBlog.sub_texts">
            <h5>{{ texts.title }}</h5>
            <p>{{ texts.text }}</p>
        </div>
    </div>
</div>
